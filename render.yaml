# Render deployment (https://render.com) — one web service runs the whole app.
# The committed data/index + data/pages let it start WITHOUT Ollama; embeddings
# and image captioning both use OpenAI in the cloud (set OPENAI_API_KEY below).
services:
  - type: web
    name: multimodal-rag-qwen-vl
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENAI_API_KEY   # set in the Render dashboard (never commit it)
        sync: false
      - key: EMBED_BACKEND
        value: "openai"
      # Load the committed FAISS index instead of re-embedding 250 passages at
      # startup (which fails on the free-tier cold start). Only query embeddings
      # hit OpenAI at runtime.
      - key: USE_PREBUILT_INDEX
        value: "1"
      # KEEP IMAGE QUERIES ON QWEN-VL IN THE CLOUD: set a hosted Qwen-VL key
      # (OpenRouter or DashScope). If present, get_vlm() uses real Qwen2.5-VL;
      # only if it is absent does it fall back to OpenAI vision.
      - key: QWEN_VL_API_KEY  # set in the Render dashboard (OpenRouter/DashScope)
        sync: false
      # Defaults target OpenRouter's Qwen2.5-VL; override for DashScope if needed.
      - key: QWEN_VL_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: QWEN_VL_MODEL
        value: "qwen/qwen-2.5-vl-7b-instruct"
